aid: e6data
name: e6data
description: >-
  e6data is a lakehouse compute engine built to run high-concurrency, complex
  SQL analytics and AI workloads directly on open table formats (Apache Iceberg,
  Delta Lake, Apache Hudi, Hive) with zero data movement, claiming 10x faster
  queries at 60% lower cost through a decentralized, Kubernetes-native "atomic"
  architecture that scales compute incrementally. It deploys serverless or in a
  customer VPC across AWS, GCP and Azure, and interoperates with Databricks,
  Snowflake, Redshift and Microsoft Fabric. Developers connect over SQL via a
  JDBC type-4 driver, an official Python connector, and common BI/SQL tools
  (DBeaver, Superset, Tableau, Power BI, Metabase, Zeppelin, Jupyter), plus a
  narrow REST surface for query-history reporting. Access is authenticated with
  Personal Access Tokens and Service Accounts and governed by RBAC with
  row/column-level controls and SSO. Backed by Accel.
